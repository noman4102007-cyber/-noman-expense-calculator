<!doctype html>
<html>
  <head>
    <title>Noman Ka Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Expense Calculator 💰</h1>

      <input type="text" id="expName" placeholder="Expense Name" />
      <input type="number" id="expAmount" placeholder="Amount (₹)" />
      <button id="addBtn">Add Expense</button>

      <h3>Total: ₹<span id="totalAmount">0</span></h3>
      <ul id="expenseList"></ul>
    </div>

    <!-- JavaScript file ko hamsa body ke end me link karte hain -->
    <script src="script.js"></script>
  </body>
</html>
